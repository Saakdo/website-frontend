<!DOCTYPE html>
<html lang="en">

        <meta charset="UTF-8">

            <nav class="navbar" id="bar">

                <a href="gallery.html" id="gallery-link">Gallery</a>

            <div class="lang_button">

            </div>
        </div>
        
        <script>
            window.onload = function() {
                const savedLanguage = localStorage.getItem('selectedLanguage') || 'en';  // Default to 'en' if no language is saved
                switchLanguage(savedLanguage);  // Call the function to switch language after loading
            };
        </script>
    <script src="languages.js"></script>
